[tools]
# Core development languages
go = "1.25"
python = "3.12"
rust = "1.94.0"

# CLI utilities
ast-grep = "latest"
atuin = "18.19.0"
bitwarden = "latest"
bottom = "latest"
cargo-binstall = "latest"
"cargo:https://github.com/asciinema/agg" = "latest"
delta = "latest"
duckdb = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
"github:asciinema/asciinema" = "latest"
"go:github.com/boyter/cs/v3" = "latest"
hyperfine = "latest"
jj = "v0.45.0"
jjui = "latest"
jq = "latest"
kubectl = "latest"
neovim = "0.12.2"
opencode = "1.1.20"                                           # tracking accidental musl: https://github.com/anomalyco/opencode/issues/8826
prek = "latest"
ripgrep = "latest"
tree-sitter = "0.26.9"
typst = "latest"
uv = "latest"
zellij = "0.45.0"
zoxide = "latest"
"aqua:tailscale/tailscale" = "latest"
"aqua:fish-shell/fish-shell" = "latest"
"cargo:https://github.com/connor15mcc/jj-vine" = "latest"
tools = { version = "latest", postinstall = '$MISE_TOOL_INSTALL_PATH/tools install' }

[tool_alias]
tools = "github:connor15mcc/tools"
asciinema = "github:asciinema/asciinema"

[env]
EDITOR = "nvim"

[tasks.bootstrap]
description = "Complete development environment setup"
run = """
mise install
mise run init-tools
"""

[tasks.init-tools]
description = "Initialize tool configurations"
depends = ["init-atuin"]
run = """
echo "Tools initialized successfully!"
mise doctor
"""

[tasks.init-atuin]
description = "Initialize atuin history management"
run = """
# Import existing shell history if first time setup
if [ ! -f ~/.local/share/atuin/history.db ]; then
  atuin import zsh || echo "No shell history to import"
fi
"""

[settings]
idiomatic_version_file_enable_tools = ["rust"]
