[user]
name = "Connor McCarthy"
email = "connor15mcc@gmail.com"

[ui]
default-command = ["log", "--template=builtin_log_compact"]
pager = "delta"
diff-formatter = ":git"
editor = "nvim"

[snapshot]
auto-update-stale = true

[templates]
git_push_bookmark = '"connor15mcc/" ++ change_id.shortest(3)'
draft_commit_description = '''
concat(
  coalesce(description, default_commit_description, "\n"),
  "
JJ: ignore-rest

JJ: feat: introduces a new feature
JJ: fix: fixes a bug
JJ: refactor: code changes that neither fix a bug nor introduce a feature
JJ: test: addition of missing tests or corrections to existing tests
JJ: docs: changes in documentation only
JJ: style: code changes that do not impact the functionality
JJ: perf: code changes that improve performance
JJ: chore: changes that do not modify the source code or test files
JJ: build: changes affecting the build system or external dependencies
JJ: ci: changes to continuous integration configuration files and scripts
JJ: revert: reverts a previously made commit

JJ: reference: JIRA-1234
JJ: Co-authored-by: name <user@users.noreply.github.com>
",
  surround(
    "\nJJ: This commit contains the following changes:\n", "\n",
    indent("JJ:     ", diff.stat(72)),
  ),
  diff.git(),
)
'''
log_node = '''
  label("node",
    coalesce(
      if(!self, label("elided", "~")),
      if(current_working_copy, label("working_copy", "@")),
      if(conflict, label("conflict", "×")),
      if(immutable, label("immutable", "*")),
      label("normal", "·")
    )
  )
'''
file_annotate = '''
separate(" ",
  commit.change_id().shortest(8),
  pad_end(8, truncate_end(8, commit.author().name())),
  pad_end(11, format_timestamp(commit_timestamp(commit))),
  pad_start(4, line_number),
) ++ ": " ++ content
'''

[aliases.jj]
doc = "Forward (accidentally) nested commands back to `jj`"
definition = ["util", "exec", "--", "jj"]

[aliases.tug]
doc = "Advance a bookmark to the latest revision"
definition = ["bookmark", "advance"]

[aliases.mine]
doc = "List bookmarks on revisions I authored"
definition = ["bookmark", "list", "-r", "mine()"]

[aliases.accuse]
doc = "Annotate file lines with their originating commit"
definition = ["file", "annotate"]

[aliases.long]
doc = "Show detailed log output"
definition = ["log", "--template", "builtin_log_detailed"]

[aliases.collapse]
doc = "Squash all commits on the current branch into the branch start"
definition = [
  "squash",
  "--from",
  "branch_start(@)+::@",
  "--to",
  "branch_start(@)",
]

[aliases.iso]
doc = "Create an isolated workspace via jj-iso"
definition = ["util", "exec", "--", "jj-iso"]

[aliases.pr]
doc = "Open or manage pull requests via jj-vine"
definition = ["util", "exec", "--", "jj-vine"]

[aliases.prek]
doc = "Run prek (pre-commit) on recent (reachable) changes"
# recent discussion in discord:
# https://discord.com/channels/968932220549103686/968932220549103689/1523207332094415019
definition = [
  "util",
  "exec",
  "--",
  "jj",
  "run",
  "--jobs",
  "4",      # arbitrarily chosen...
  "--",
  "bash",
  "-c",
  # `$JJ_COMMIT_ID` is set for us via `jj run`. `path` renders repo-root-relative
  # paths, which is what prek expects.
  '''
  prek run --files $(jj diff -T 'path ++ "\n"' -r "$JJ_COMMIT_ID")
  ''',
]

[aliases.plan]
doc = "Add an empty change at tip with a given desc"
definition = [
  "new",
  "--no-edit",
  "--insert-after",
  # the one
  #   latest change
  #       on trunk that has either content or a desc
  '''
  exactly(
    heads(trunk():: & (~empty() | ~description(""))), 1
  )
''',
  "-m",
]

[aliases.stage]
doc = "Stack all non-empty changes after the active megamerge"
definition = [
  "util",
  "exec",
  "--",
  "jj-stack",
  "-r",
  "active_megamerge(@)+:: ~ empty()",
]

[aliases.stack]
doc = "Insert a revision as a new branch under the active megamerge"
definition = ["util", "exec", "--", "jj-stack", "-r"]

[aliases.restack]
doc = "Rebase megamerge changes onto trunk"
definition = ["rebase", "--destination", "trunk()", "--simplify-parents"]

[revsets]
bookmark-advance-to = 'closest_pushable(@)'
# show only up-to-date changes.
# this facilitates dropping work from actively tracked (megamerge),
# while balancing log noise and avoiding the desire to abandon entirely
#
# the megamerge and everything above it
# | every change under the megamerge
# | the commit that the stack sits on, for bearings
# | the commit that the head sits on, so that the graph reaches trunk
# | recent changes on trunk, for bearings
# | the whole branch that the head sits on, even without a megamerge
# | children of the head
log = '''
  active_megamerge(@)::
  | trunk()..active_megamerge(@)
  | roots(trunk()..active_megamerge(@))-
  | roots(trunk()..@)-
  | ancestors(trunk(), 2)
  | trunk()..@
  | @::
'''

[revset-aliases]
'/' = 'trunk()'
# don't consider branches descendant from my changes to be immutable
# (depend on my work at your own risk!)
"immutable_heads()" = '''
  (builtin_immutable_heads() | (trunk().. & ~mine()))
  ~ (mine() & trunk()..)::
'''

'closest_bookmark(to)' = 'heads(::to & bookmarks())'
'closest_pushable(to)' = 'heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))'
# the second arm keeps the megamerge visible when `to` is off the stack
"active_megamerge(to)" = '''
  coalesce(
    heads(::to & merges() & (trunk()..)),
    heads(mine() & merges() & (trunk()..)),
  )
'''
"branch_start(to)" = "heads(::to & trunk())+ & ::to"
# https://github.com/jj-vcs/jj/discussions/5669
'why_immutable(r)' = '(r & immutable()) | roots(r:: & immutable_heads())'


[template-aliases]
# Show unique prefix and the rest surrounded by brackets
'format_short_id(id)' = 'id.shortest(12).prefix() ++ "[" ++ id.shortest(12).rest() ++ "]"'
# Show username (rather than email)
'format_short_signature(signature)' = 'signature.email().local()'
default_commit_description = '''
"

"
'''
"format_timestamp(timestamp)" = "timestamp.ago()"

[git]
private-commits = "description(glob:'private:*') | description(glob:'wip:*') | description(glob:'plan:*')"

[fix.tools.rustfmt]
command = ["rustfmt", "+nightly", "--edition", "2024"]
patterns = ["glob:**/*.rs"]

[fix.tools.1-ruff-lint]
command = [
  "uv",
  "run",
  "ruff",
  "check",
  "--fix",
  "--preview",
  "--quiet",
  "--stdin-filename=$path",
  "-",
]
patterns = ["glob:'**/*.py'"]

[fix.tools.2-ruff-format]
command = ["uv", "run", "ruff", "format", "--stdin-filename=$path", "-"]
patterns = ["glob:'**/*.py'"]

[fix.tools.gofmt]
command = ["goimports"]
patterns = ["glob:'**/*.go'"]

[merge-tools.":both"]
program = "jj-merge-both"
merge-args = ["$base", "$left", "$right", "$output"]

[jj-vine]
description.sync = true
