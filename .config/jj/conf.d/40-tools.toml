[fix.tools.rustfmt]
command = ["rustfmt", "+nightly", "--edition", "2024"]
patterns = ["glob:**/*.rs"]

[fix.tools.1-ruff-lint]
command = [
  "uv",
  "run",
  "ruff",
  "check",
  "--fix",
  "--preview",
  "--quiet",
  "--stdin-filename=$path",
  "-",
]
patterns = ["glob:'**/*.py'"]

[fix.tools.2-ruff-format]
command = ["uv", "run", "ruff", "format", "--stdin-filename=$path", "-"]
patterns = ["glob:'**/*.py'"]

[fix.tools.gofmt]
command = ["goimports"]
patterns = ["glob:'**/*.go'"]

[merge-tools.":both"]
program = "jj-merge-both"
merge-args = ["$base", "$left", "$right", "$output"]
